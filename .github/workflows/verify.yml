name: Verify

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend unit + contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Runs against an in-memory H2 database with the seeded demo dataset
      # (src/test/resources/application.yml) - no PostgreSQL or AI engine needed.
      - name: mvn test
        run: mvn -B -f backend-java/pom.xml test

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend-java/target/surefire-reports
          if-no-files-found: ignore

  ai-engine-tests:
    name: AI engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r ai-engine/requirements.txt

      # Must run from ai-engine/: `import main` in the test module relies on the
      # working directory being on sys.path.
      - name: pytest
        working-directory: ai-engine
        run: python -m pytest tests -q

  frontends-build:
    name: Frontend production builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [admin, mobile-web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install and build
        working-directory: ${{ matrix.app }}
        run: |
          npm ci
          npm run build

  e2e:
    name: Docker stack end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bring up the full stack
        env:
          JWT_SECRET: ci-jwt-secret-please-rotate-this-to-32-plus-chars
          AI_ENGINE_API_KEY: ci-ai-engine-key
          POSTGRES_PASSWORD: ci-postgres-password
          # e2e-check.mjs logs in with the seeded demo users, so CI opts in.
          # Local/CI-default is off (see docker-compose.yml).
          SEED_DEMO_DATA: "true"
        run: docker compose up --build -d

      - name: Wait for API + AI engine
        run: |
          for i in $(seq 1 60); do
            api=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:5000/api/health || true)
            ai=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:5001/api/health || true)
            if [ "$api" = "200" ] && [ "$ai" = "200" ]; then
              echo "Both services are healthy."
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for the stack."
          docker compose logs
          exit 1

      - name: End-to-end checks
        run: node scripts/e2e-check.mjs

      - name: Evidence integrity checks
        run: node scripts/integrity-check.mjs

      - name: Tear down
        if: always()
        run: docker compose down -v
