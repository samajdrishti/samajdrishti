name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd admin && npm ci
      - run: cd admin && npm run lint --if-present
      - run: cd admin && npm run format -- --check --if-present

  lint-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd mobile-web && npm ci
      - run: cd mobile-web && npm run lint --if-present
      - run: cd mobile-web && npm run format -- --check --if-present

  test-admin:
    runs-on: ubuntu-latest
    needs: [lint-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd admin && npm ci
      - run: cd admin && npm run test -- --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-test-results
          path: admin/vitest-report/**

  test-mobile:
    runs-on: ubuntu-latest
    needs: [lint-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd mobile-web && npm ci
      - run: cd mobile-web && npm run test -- --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-results
          path: mobile-web/vitest-report/**

  test-ai-engine:
    runs-on: ubuntu-latest
    needs: [test-admin, test-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd ai-engine
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest pytest-cov
      - name: Run tests
        run: |
          cd ai-engine
          .venv/bin/pytest tests/ -v --cov=./models --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-engine-test-results
          path: ai-engine/.coverage

  build-admin:
    runs-on: ubuntu-latest
    needs: [test-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd admin && npm ci
      - run: cd admin && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: admin/dist/

  build-mobile:
    runs-on: ubuntu-latest
    needs: [test-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: cd mobile-web && npm ci
      - run: cd mobile-web && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-build
          path: mobile-web/dist/

  build-ai-engine:
    runs-on: ubuntu-latest
    needs: [test-ai-engine]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build ./ai-engine -t ai-engine:latest

  summary:
    runs-on: ubuntu-latest
    needs: [build-admin, build-mobile, build-ai-engine]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Summary"
          echo ""
          echo "All jobs completed successfully!"
          echo ""
          echo "### Artifacts:"
          echo "- \`admin-build\` - Admin dashboard static files"
          echo "- \`mobile-build\` - Mobile PWA static files"
          echo "- \`ai-engine-dist\` - AI engine Python wheel"
          echo ""
          echo "### Next Steps:"
          echo "Use \`docker-compose up --build\` to start all services locally."